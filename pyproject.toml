[project]
name = "wplos"
version = "0.1.0"
description = "Women Personal Life OS — domain foundation for the Six-Mind Architecture (Master Architecture V3)"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wplos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle / pyflakes
    "I",                # import order
    "UP",               # pyupgrade
    "B",                # bugbear
    "C4",               # comprehensions
    "SIM",              # simplify
    "RUF",              # ruff rules
    "ANN",              # missing annotations
    "TID",              # tidy imports
]
ignore = [
    "ANN401",           # explicit Any is rejected by design, not by lint waiver
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN201", "ANN001"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
packages = ["wplos"]
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
disallow_any_explicit = true
enable_error_code = ["redundant-expr", "possibly-undefined"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_any_explicit = false

[tool.pydantic-mypy]
init_typed = true
warn_required_dynamic_aliases = true
